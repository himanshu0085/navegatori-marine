name: CI and Deploy to GoDaddy

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Static Website CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required website files
        run: |
          set -eu
          for file in index.html style.css main.js logo.png; do
            if [ ! -f "$file" ]; then
              echo "::error::Required website file is missing: $file"
              exit 1
            fi
          done

      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class HTMLCheck(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.html_count = 0
                  self.head_count = 0
                  self.body_count = 0

              def handle_starttag(self, tag, attrs):
                  if tag == "html":
                      self.html_count += 1
                  elif tag == "head":
                      self.head_count += 1
                  elif tag == "body":
                      self.body_count += 1

          parser = HTMLCheck()
          try:
              parser.feed(Path("index.html").read_text(encoding="utf-8"))
              parser.close()
          except Exception as exc:
              raise SystemExit(f"HTML parsing failed: {exc}")

          if parser.html_count != 1:
              raise SystemExit(f"Expected one <html> tag; found {parser.html_count}")
          if parser.head_count != 1 or parser.body_count != 1:
              raise SystemExit(
                  f"Expected one <head> and one <body>; got "
                  f"<head>={parser.head_count}, <body>={parser.body_count}"
              )
          print("HTML structure check passed.")
          PY

      - name: Validate JavaScript syntax
        run: node --check main.js

      - name: Check local asset references
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("style.css").read_text(encoding="utf-8")
          errors = []

          for value in re.findall(r'''(?:src|href)\s*=\s*["']([^"']+)["']''', html, flags=re.I):
              value = value.strip()
              if not value or value.startswith(("#", "//")):
                  continue
              if urlparse(value).scheme or value.startswith(("data:", "mailto:", "tel:")):
                  continue
              path = value.split("?", 1)[0].split("#", 1)[0]
              if path and not Path(path).exists():
                  errors.append(f"index.html references missing local file: {value}")

          for value in re.findall(r'''url\(\s*["']?([^"'\)]+)["']?\s*\)''', css, flags=re.I):
              value = value.strip()
              if not value or value.startswith(("#", "//", "data:")):
                  continue
              if urlparse(value).scheme:
                  continue
              path = value.split("?", 1)[0].split("#", 1)[0]
              if path and not Path(path).exists():
                  errors.append(f"style.css references missing local file: {value}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print("Local asset reference checks passed.")
          PY

      - name: Check for merge conflict markers
        run: |
          # Check only unambiguous conflict start/end markers.
          # A bare ======= line is valid in CSS comments and must not fail CI.
          if git grep -n -E '^(<<<<<<< |>>>>>>>)' -- index.html style.css main.js; then
            echo "::error::Merge conflict markers found."
            exit 1
          fi
          echo "No merge conflict start/end markers found."

  deploy:
    name: Deploy to GoDaddy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            **/.env
            **/.env.*
